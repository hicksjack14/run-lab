<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="runlab-static" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Lab</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#061223">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Run Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/analytics.css">
</head>
<body>
<canvas id="backdrop" aria-hidden="true"></canvas>

<header class="topbar">
  <a class="brand" href="#/" aria-label="Run Lab home"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">Run Lab</span></a>
  <nav class="nav" aria-label="Main">
    <a href="#/" data-route="home" aria-label="Home" title="Home"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span class="nav-label">Home</span></a>
    <a href="#/runs" data-route="runs" aria-label="Runs" title="Runs"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg><span class="nav-label">Runs</span></a>
    <a href="#/plan" data-route="plan" aria-label="Planner" title="Planner"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span class="nav-label">Planner</span></a>
    <a href="#/races" data-route="races" aria-label="Races" title="Races"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4"/><path d="M4 4h12l-2 4 2 4H4"/></svg><span class="nav-label">Races</span></a>
    <a href="#/calc" data-route="calc" aria-label="Calculator" title="Calculator"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg><span class="nav-label">Calculator</span></a>
    <a href="#/stretches" data-route="stretches" aria-label="Stretches" title="Stretches"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1.2"/><path d="m9 21 3-6 3 6"/><path d="m5 8 7 2 7-2"/><path d="M12 10v5"/></svg><span class="nav-label">Stretches</span></a>
    <a href="#/workouts" data-route="workouts" aria-label="Workouts" title="Workouts"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6v12M18 6v12M3 9v6M21 9v6M6 12h12"/></svg><span class="nav-label">Workouts</span></a>
    <a href="#/analytics" data-route="analytics" aria-label="Analytics" title="Analytics"><svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M8 17v-6M13 17V6M18 17v-4"/></svg><span class="nav-label">Analytics</span></a>
  </nav>
  <div class="topbar-end">
    <span id="snap-chip" hidden style="display:none"></span><!-- never shown; keeps older cached copies of main.js from crashing on a missing element -->
    <span class="chip chip-demo" id="demo-chip" hidden title="You are looking at generated demo data, not your runs">Demo data</span>
    <button type="button" class="btn btn-quiet" id="sync-btn" hidden>Sync Strava</button>
  </div>
</header>

<main id="view" tabindex="-1"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
