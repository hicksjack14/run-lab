<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Lab</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#061223">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/analytics.css">
</head>
<body>
<canvas id="backdrop" aria-hidden="true"></canvas>

<header class="topbar">
  <a class="brand" href="#/" aria-label="Run Lab home"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">Run Lab</span></a>
  <nav class="nav" aria-label="Main">
    <a href="#/" data-route="home">Home</a>
    <a href="#/runs" data-route="runs">Runs</a>
    <a href="#/plan" data-route="plan">Planner</a>
    <a href="#/calc" data-route="calc">Calculator</a>
    <a href="#/analytics" data-route="analytics">Analytics</a>
  </nav>
  <div class="topbar-end">
    <span class="chip" id="snap-chip" hidden></span>
    <span class="chip chip-demo" id="demo-chip" hidden title="You are looking at generated demo data, not your runs">Demo data</span>
    <button type="button" class="btn btn-quiet" id="sync-btn" hidden>Sync Strava</button>
  </div>
</header>

<main id="view" tabindex="-1"></main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
